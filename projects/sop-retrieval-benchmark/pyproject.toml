[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sop-retrieval-benchmark"
version = "0.1.0"
description = "Offline benchmark that measures whether retrieval over site-specific warehouse SOPs returns the right clause for the right site."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sop-bench = "sop_retrieval_benchmark.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
