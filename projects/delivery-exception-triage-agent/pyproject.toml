[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-exception-triage-agent"
version = "0.1.0"
description = "A tool-calling triage agent for delivery exception tickets, with validated tools, policy guardrails and an offline baseline planner."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
