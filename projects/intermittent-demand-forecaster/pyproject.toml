[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intermittent-demand-forecaster"
version = "0.1.0"
description = "Classify spare-parts demand, backtest intermittent demand forecasting methods and pick the best one per SKU."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.scripts]
intermittent-demand = "intermittent_demand_forecaster.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
